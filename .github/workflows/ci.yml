name: ci

# Minutes are limited (#96): push builds run on main only, and macOS (billed 10x) skips pull requests; it runs on
# main pushes and manual runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-msvc","linux-gcc","linux-clang"]' || '["windows-msvc","linux-gcc","linux-clang","macos"]') }}
    # windows-2022: VS 2022 generator (D-3)
    runs-on: ${{ matrix.preset == 'windows-msvc' && 'windows-2022' || matrix.preset == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi

      # Full clone: builtin-baseline (vcpkg.json) needs the port history.
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}-release
      - run: ctest --preset ${{ matrix.preset }}-release
